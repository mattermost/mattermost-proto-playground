version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Unpublished; linked via file:../compass-design (see package.json).
      - dependency-name: '@mattermost/compass-proto'
      # Held to match the Mattermost webapp: eslint-plugin-jsx-a11y does not
      # support ESLint 10 yet.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript-eslint and the Mattermost webapp do not support TypeScript 6+.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Keep @types/node on the same major as the Node runtime (engines: ^24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # plugin-react 6 requires Vite 8, whose Rolldown bundler currently renders a
      # blank page with this vite.config.ts (module interop). Hold both until the
      # Vite 8 migration is done as its own change.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
    groups:
      compass:
        patterns:
          - '@mattermost/compass-*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'globals'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
