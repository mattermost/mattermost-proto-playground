version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Unpublished; linked via file:../compass-design (see package.json).
      - dependency-name: '@mattermost/compass-proto'
    groups:
      compass:
        patterns:
          - '@mattermost/compass-*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'globals'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
