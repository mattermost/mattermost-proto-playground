name: Compass UI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@mattermost/compass-ui

      - name: Build
        run: npm run build --workspace=@mattermost/compass-ui

      - name: Pack tarball
        run: npm pack --workspace=@mattermost/compass-ui

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-ui-package
          path: packages/compass-ui/mattermost-compass-ui-*.tgz
